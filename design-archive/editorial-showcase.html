<!DOCTYPE html>
<!--
  DISEÑO ARCHIVADO — "Editorial Showcase"
  Guardado el 2026-07-09 desde la sección #proyectos del portafolio.
  Filas alternadas con número fantasma gigante (outline del color de acento,
  desvanecido hacia abajo), captura en marco de pantalla con perspectiva 3D
  que se endereza al hover, y halo de acento detrás.

  Autocontenido: ábrelo directo en el navegador para verlo.
  Para reutilizarlo: copia el bloque .pj-list (HTML) y el bloque de CSS.
  Cada item define su acento con --pj-accent / --pj-glow inline.
-->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Archive — Editorial Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kdam+Thmor+Pro&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e16;
  --fg: #f8f8f2;
  --muted: #7b8ab8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding: 80px 24px;
}

.container { max-width: 1000px; margin: 0 auto; }

/* ============================================================
   EDITORIAL SHOWCASE
   ============================================================ */

.pj-list {
  display: flex;
  flex-direction: column;
  gap: 110px;
  margin-top: 70px;
}

.pj-row {
  --pj-accent: #bd93f9;
  --pj-glow: rgba(189, 147, 249, 0.4);
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  gap: 56px;
  align-items: center;
}

.pj-row:nth-child(even) .pj-visual { order: -1; }

.pj-info {
  position: relative;
  padding-top: 78px;
}

/* Giant ghost index above the text, barely kissing the tag line */
.pj-index {
  position: absolute;
  top: -18px;
  left: -4px;
  z-index: 0;
  font-family: 'Kdam Thmor Pro', sans-serif;
  font-size: 6.8rem;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1.5px color-mix(in srgb, var(--pj-accent) 38%, transparent);
  user-select: none;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 40%, transparent 96%);
  mask-image: linear-gradient(180deg, rgba(0,0,0,0.9) 40%, transparent 96%);
}

.pj-tag {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--pj-accent);
  margin-bottom: 14px;
}

.pj-tag::before {
  content: '';
  width: 26px;
  height: 1px;
  background: var(--pj-accent);
}

.pj-title {
  font-family: 'Kdam Thmor Pro', sans-serif;
  font-size: clamp(1.6rem, 3vw, 2.1rem);
  line-height: 1.15;
  color: var(--fg);
  margin: 0 0 14px;
}

.pj-desc {
  color: var(--muted);
  font-size: 0.98rem;
  font-weight: 300;
  line-height: 1.75;
  margin: 0;
  max-width: 400px;
}

.pj-visual {
  position: relative;
  perspective: 1400px;
}

.pj-visual::before {
  content: '';
  position: absolute;
  inset: 8% 4%;
  z-index: -1;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, var(--pj-glow), transparent 68%);
  filter: blur(30px);
  opacity: 0.65;
  transition: opacity 0.6s ease;
}

.pj-row:hover .pj-visual::before { opacity: 1; }

.pj-screen {
  border-radius: 14px;
  overflow: hidden;
  background: #0c0d18;
  border: 1px solid color-mix(in srgb, var(--pj-accent) 30%, rgba(255, 255, 255, 0.1));
  box-shadow:
    0 40px 80px -20px rgba(0, 0, 0, 0.65),
    0 0 50px -18px var(--pj-glow);
  transform: rotateY(-9deg) rotateX(2.5deg);
  transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.7s ease;
}

.pj-row:nth-child(even) .pj-screen {
  transform: rotateY(9deg) rotateX(2.5deg);
}

.pj-row:hover .pj-screen {
  transform: rotateY(0deg) rotateX(0deg) scale(1.015);
  box-shadow:
    0 45px 90px -20px rgba(0, 0, 0, 0.7),
    0 0 70px -12px var(--pj-glow);
}

.pj-screen-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.04);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.pj-screen-bar span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
}

.pj-screen-bar span:first-child {
  background: color-mix(in srgb, var(--pj-accent) 75%, transparent);
}

.pj-screen img {
  width: 100%;
  aspect-ratio: 16 / 9.3;
  object-fit: cover;
  object-position: top;
  display: block;
}

@media (max-width: 820px) {
  .pj-list { gap: 72px; margin-top: 48px; }
  .pj-row { grid-template-columns: 1fr; gap: 26px; }
  .pj-row .pj-visual,
  .pj-row:nth-child(even) .pj-visual { order: -1; }
  .pj-screen,
  .pj-row:nth-child(even) .pj-screen { transform: none; }
  .pj-info { padding-top: 0; }
  .pj-index { top: -14px; right: 0; left: auto; font-size: 5rem; }
}
</style>
</head>
<body>
<div class="container">
  <div class="pj-list">
    <article class="pj-row" style="--pj-accent: #ffb86c; --pj-glow: rgba(255, 184, 108, 0.4);">
      <div class="pj-info">
        <span class="pj-index" aria-hidden="true">01</span>
        <span class="pj-tag">Etiqueta</span>
        <h3 class="pj-title">Título del Item</h3>
        <p class="pj-desc">Descripción corta del item. Una o dos líneas que expliquen de qué se trata.</p>
      </div>
      <div class="pj-visual">
        <div class="pj-screen">
          <div class="pj-screen-bar"><span></span><span></span><span></span></div>
          <img src="https://placehold.co/900x540/151628/7b8ab8?text=Imagen+01" alt="" />
        </div>
      </div>
    </article>

    <article class="pj-row" style="--pj-accent: #50fa7b; --pj-glow: rgba(80, 250, 123, 0.35);">
      <div class="pj-info">
        <span class="pj-index" aria-hidden="true">02</span>
        <span class="pj-tag">Etiqueta</span>
        <h3 class="pj-title">Título del Item</h3>
        <p class="pj-desc">Descripción corta del item. Una o dos líneas que expliquen de qué se trata.</p>
      </div>
      <div class="pj-visual">
        <div class="pj-screen">
          <div class="pj-screen-bar"><span></span><span></span><span></span></div>
          <img src="https://placehold.co/900x540/151628/7b8ab8?text=Imagen+02" alt="" />
        </div>
      </div>
    </article>
  </div>
</div>
</body>
</html>
